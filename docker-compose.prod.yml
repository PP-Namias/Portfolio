name: namias-portfolio-prod

services:
  portfolio-v1:
    build:
      context: ./portfolio-v1
      dockerfile: Dockerfile
      target: runner
    container_name: namias-v1
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    init: true
    restart: always
    read_only: true
    tmpfs:
      - /app/.next/cache:size=256m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - namias-prod-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: runner
    container_name: namias-ai
    ports:
      - "8787:8787"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8787
      - AI_SERVICE_TRUST_PROXY=1
    volumes:
      - ai-data:/app/.ai-service-data
    init: true
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - namias-prod-net

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
      target: runner
    container_name: namias-studio
    ports:
      - "3333:3333"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=3333
    init: true
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - namias-prod-net

  nginx:
    build:
      context: ./.docker/nginx
      dockerfile: Dockerfile
    container_name: namias-proxy
    ports:
      - "8080:80"
    depends_on:
      portfolio-v1:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      studio:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=16m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - namias-prod-net

volumes:
  ai-data:

networks:
  namias-prod-net:
    driver: bridge
    name: namias-prod-net
