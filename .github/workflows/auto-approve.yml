name: Auto Approve PR

on:
  # ONLY schedule — eliminates race condition with check creation
  # On PR events, new checks haven't started yet so the bot would
  # see old passing checks and approve prematurely.
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: allPrs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });

            const prs = allPrs.filter(pr =>
              !pr.draft &&
              pr.head.repo.full_name === `${owner}/${repo}` &&
              pr.base.ref === 'main'
            );

            if (prs.length === 0) {
              core.notice('No open PRs to check');
              return;
            }

            for (const pr of prs) {
              const headSha = pr.head.sha;

              // Skip if already approved by a bot
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number
              });
              const alreadyApproved = reviews.some(
                r => r.user?.type === 'Bot' && r.state === 'APPROVED' &&
                     new Date(r.submitted_at) > new Date(pr.updated_at)
              );
              if (alreadyApproved) continue;

              // Get ALL check runs for this PR's head SHA
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100
              });

              // Only consider checks triggered BY this PR (not external)
              const relevantRuns = checkRuns.data.filter(run => {
                const name = (run.name || '').toLowerCase();
                return name.includes('quality check') ||
                       name.includes('security scan') ||
                       name.includes('security scanning') ||
                       name.includes('checkov') ||
                       name.includes('gitleaks') ||
                       name.includes('osv-scanner') ||
                       name.includes('trivy-fs') ||
                       name.includes('zizmor') ||
                       name.includes('pentestagent') ||
                       name.includes('vercel') ||
                       name.includes('workers builds');
              });

              if (relevantRuns.length === 0) {
                core.notice(`PR #${pr.number}: No required checks found yet — skipping`);
                continue;
              }

              // Wait for ALL checks to complete
              const incomplete = relevantRuns.filter(r => r.status !== 'completed');
              if (incomplete.length > 0) {
                core.notice(
                  `PR #${pr.number}: ${incomplete.length}/${relevantRuns.length} checks still running. Waiting.`
                );
                continue;
              }

              // ALL complete — check for failures
              const failed = relevantRuns.filter(r =>
                r.conclusion !== 'success' &&
                r.conclusion !== 'skipped' &&
                r.conclusion !== 'neutral'
              );

              if (failed.length > 0) {
                const details = failed.map(r =>
                  `  - ${r.name}: ${r.conclusion} ${r.html_url || ''}`
                ).join('\n');
                core.warning(
                  `PR #${pr.number}: ${failed.length} check(s) failed:\n${details}`
                );
                continue;
              }

              // ALL checks passed — approve
              await github.rest.pulls.createReview({
                owner, repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: `All ${relevantRuns.length} required checks passed — auto-approved.`
              });
              core.notice(`PR #${pr.number} auto-approved`);
            }
