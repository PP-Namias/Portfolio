name: Auto Approve PR

on:
  check_suite:
    types: [completed]
  # Also trigger when check runs complete (covers cases where
  # check_suite doesn't fire for individual check runs)
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    if: >
      (github.event.check_suite?.conclusion == 'success' ||
       github.event.check_run?.conclusion == 'success') &&
      (github.event.check_suite?.head_branch || github.event.check_run?.check_suite?.head_branch) !=
      github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = context.payload.check_suite?.head_branch ||
                               context.payload.check_run?.check_suite?.head_branch;
            const headSha = context.payload.check_suite?.head_sha ||
                            context.payload.check_run?.head_sha;

            if (!headBranch || !headSha) {
              core.notice('Could not determine branch or SHA — skipping');
              return;
            }

            // Find the open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              core.notice(`No open PR found for branch ${headBranch}`);
              return;
            }

            const pr = prs[0];

            if (pr.draft) {
              core.notice(`PR #${pr.number} is draft — skipping`);
              return;
            }

            // Skip fork PRs
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice(`PR #${pr.number} is from a fork — skipping approval`);
              return;
            }

            // Check if already approved
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number
            });

            const alreadyApproved = reviews.some(
              r => r.user?.type === 'Bot' && r.state === 'APPROVED'
            );

            if (alreadyApproved) {
              core.notice(`PR #${pr.number} already has bot approval`);
              return;
            }

            // Get ALL check runs for this SHA
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: headSha,
              per_page: 100
            });

            // Define required check patterns (must ALL pass)
            const requiredPatterns = [
              'Quality Check',
              'Security Scan',
              'Security Scanning',
              'checkov',
              'gitleaks',
              'osv-scanner',
              'trivy-fs',
              'zizmor',
              'PentestAgent',
              'Vercel',
              'Workers Builds',
            ];

            const relevantRuns = checkRuns.data.filter(run => {
              const name = run.name?.toLowerCase() || '';
              return requiredPatterns.some(p =>
                name.includes(p.toLowerCase())
              );
            });

            // Check for INCOMPLETE checks (still running/pending)
            const incompleteRuns = relevantRuns.filter(run =>
              run.status !== 'completed'
            );

            if (incompleteRuns.length > 0) {
              const names = incompleteRuns.map(r => r.name).join(', ');
              core.notice(
                `PR #${pr.number}: ${incompleteRuns.length} check(s) still running: ${names}. ` +
                `Waiting for all checks to complete before evaluating.`
              );
              return;
            }

            // ALL checks are complete — now check for failures
            const failedRuns = relevantRuns.filter(run =>
              run.conclusion !== 'success' &&
              run.conclusion !== 'skipped' &&
              run.conclusion !== 'neutral'
            );

            if (failedRuns.length > 0) {
              const failDetails = failedRuns.map(r => {
                const lines = [`  - **${r.name}**: ${r.conclusion}`];
                if (r.html_url) {
                  lines.push(`    View logs: ${r.html_url}`);
                }
                return lines.join('\n');
              }).join('\n');

              core.setFailed(
                `PR #${pr.number} has ${failedRuns.length} failed check(s):\n\n${failDetails}\n\n` +
                `To fix:\n` +
                `1. Click the log URLs above to see the exact errors\n` +
                `2. Fix the issues in your code\n` +
                `3. Push a new commit — checks will re-run automatically\n\n` +
                `The PR will be auto-approved once ALL checks pass.`
              );
              return;
            }

            // ALL checks passed — approve
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: 'All required checks passed — auto-approved.'
            });

            core.notice(
              `PR #${pr.number} auto-approved — all ${relevantRuns.length} checks passed`
            );
