name: Auto Approve PR

on:
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    if: >
      github.event.check_suite.conclusion == 'success' &&
      github.event.check_suite.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = context.payload.check_suite.head_branch;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              core.notice(`No open PR found for branch ${headBranch}`);
              return;
            }

            const pr = prs[0];

            if (pr.draft) {
              core.notice(`PR #${pr.number} is draft — skipping`);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number
            });

            const alreadyApproved = reviews.some(
              r => r.user?.type === 'Bot' && r.state === 'APPROVED'
            );

            if (alreadyApproved) {
              core.notice(`PR #${pr.number} already has bot approval`);
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: 'All checks passed — auto-approved.'
            });

            core.notice(`PR #${pr.number} auto-approved`);
