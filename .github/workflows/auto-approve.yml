name: Auto Approve PR

on:
  # Poll every 2 minutes after PR events to check if ALL checks passed
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    # Run every 2 minutes to catch check completions
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // For scheduled runs, find all open PRs on non-default branches
            // For PR events, only check the specific PR
            let prsToCheck = [];

            if (context.eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber
              });
              if (pr.state === 'open' && !pr.draft) {
                prsToCheck.push(pr);
              }
            } else {
              // Scheduled or workflow_dispatch — check all open PRs
              const { data: allPrs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100
              });
              prsToCheck = allPrs.filter(pr =>
                !pr.draft &&
                pr.head.repo.full_name === `${owner}/${repo}` &&
                pr.base.ref === 'main'
              );
            }

            if (prsToCheck.length === 0) {
              core.notice('No open non-draft PRs to check');
              return;
            }

            for (const pr of prsToCheck) {
              const headSha = pr.head.sha;

              // Skip if already approved
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number
              });
              const alreadyApproved = reviews.some(
                r => r.user?.type === 'Bot' && r.state === 'APPROVED'
              );
              if (alreadyApproved) continue;

              // Get ALL check runs for this PR's head SHA
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100
              });

              // Required check patterns
              const requiredPatterns = [
                'quality check',
                'security scan',
                'security scanning',
                'checkov',
                'gitleaks',
                'osv-scanner',
                'trivy-fs',
                'zizmor',
                'pentestagent',
                'vercel',
                'workers builds',
              ];

              const relevantRuns = checkRuns.data.filter(run => {
                const name = (run.name || '').toLowerCase();
                return requiredPatterns.some(p => name.includes(p));
              });

              if (relevantRuns.length === 0) {
                core.notice(`PR #${pr.number}: No required checks found yet`);
                continue;
              }

              // Check for INCOMPLETE checks
              const incomplete = relevantRuns.filter(r => r.status !== 'completed');
              if (incomplete.length > 0) {
                core.notice(
                  `PR #${pr.number}: ${incomplete.length}/${relevantRuns.length} checks still running. Waiting.`
                );
                continue;
              }

              // ALL checks complete — check for failures
              const failed = relevantRuns.filter(r =>
                r.conclusion !== 'success' &&
                r.conclusion !== 'skipped' &&
                r.conclusion !== 'neutral'
              );

              if (failed.length > 0) {
                const details = failed.map(r =>
                  `  - ${r.name}: ${r.conclusion} → ${r.html_url || 'no link'}`
                ).join('\n');
                core.warning(
                  `PR #${pr.number}: ${failed.length} check(s) failed:\n${details}`
                );
                continue;
              }

              // ALL checks passed — approve
              await github.rest.pulls.createReview({
                owner, repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: `All ${relevantRuns.length} required checks passed — auto-approved.`
              });
              core.notice(`PR #${pr.number} auto-approved`);
            }
