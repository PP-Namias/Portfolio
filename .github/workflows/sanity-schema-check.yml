name: Sanity Schema Check

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'scripts/sanity-migrate/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check studio
        run: npx tsc --noEmit
      - name: Lint studio
        run: npm run lint -- --quiet
