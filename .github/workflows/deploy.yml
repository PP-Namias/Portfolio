name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.changes.outputs.v1 }}
      v2: ${{ steps.changes.outputs.v2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect portfolio-v1 changes
        id: changes-v1
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f383952240f2f # v3.0.2
        with:
          filters: |
            v1:
              - 'portfolio-v1/**'

      - name: Detect portfolio-v2 changes
        id: changes-v2
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f383952240f2f # v3.0.2
        with:
          filters: |
            v2:
              - 'portfolio-v2/**'

      - name: Set outputs
        id: changes
        run: |
          echo "v1=${{ steps.changes-v1.outputs.v1 }}" >> $GITHUB_OUTPUT
          echo "v2=${{ steps.changes-v2.outputs.v2 }}" >> $GITHUB_OUTPUT

  deploy-v1:
    name: Deploy V1 to Vercel
    needs: detect-changes
    if: needs.detect-changes.outputs.v1 == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/vercel-deploy-v1.yml
    secrets: inherit

  deploy-v1-cf:
    name: Deploy V1 to Cloudflare
    needs: detect-changes
    if: needs.detect-changes.outputs.v1 == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/cloudflare-deploy.yml
    secrets: inherit

  deploy-v2:
    name: Deploy V2 to Cloudflare
    needs: detect-changes
    if: needs.detect-changes.outputs.v2 == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/cloudflare-deploy-v2.yml
    secrets: inherit
