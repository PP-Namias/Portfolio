name: Sanity Studio Deploy

on:
  push:
    branches: [main, dev]
    paths:
      - 'studio/**'
  workflow_dispatch:

env:
  SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: '10'

      - name: Install dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: studio
        run: pnpm typecheck

      - name: ESLint
        working-directory: studio
        run: pnpm lint

      - name: Build
        working-directory: studio
        run: pnpm build

      - name: Verify Sanity auth token
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::SANITY_AUTH_TOKEN secret is empty or missing. Add it under GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "SANITY_AUTH_TOKEN is present"

      - name: Deploy to Sanity Hosting
        working-directory: studio
        run: pnpm run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
