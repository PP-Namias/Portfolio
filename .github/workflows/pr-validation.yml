name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level moderate || echo "Audit completed with warnings"

  comment:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [quality-check, security]
    if: always() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post PR Comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              qualityCheck: '${{ needs.quality-check.result }}',
              security: '${{ needs.security.result }}'
            };

            const label = (s) => s === 'success' ? 'Passed' : s === 'failure' ? 'Failed' : 'Skipped';

            const body = `## Pull Request Validation Results

            | Check | Status |
            |-------|--------|
            | Quality (Lint + Type + Build + Tests) | ${label(results.qualityCheck)} (${results.qualityCheck}) |
            | Security Audit | ${label(results.security)} (${results.security}) |

            **Overall**: ${results.qualityCheck === 'success' ? 'Ready to merge' : 'Issues found'}

            ---
            *Automated PR validation • [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})*`;

            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

              const botComment = comments.data.find(c =>
                c.user?.type === 'Bot' && c.body?.includes('Pull Request Validation Results')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: body
                });
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Skipping PR status comment due to permissions/integration limits: ${message}`);
            }

  approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    needs: [quality-check, security]
    if: success() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    timeout-minutes: 15
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const MAX_WAIT_SECONDS = 600;
            const POLL_INTERVAL = 20;
            let waited = 0;

            while (waited < MAX_WAIT_SECONDS) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: headSha
              });

              if (combined.state === 'success') {
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner,
                  repo,
                  pull_number: prNumber
                });

                const alreadyApproved = reviews.some(
                  r => r.user?.type === 'Bot' && r.state === 'APPROVED'
                );

                if (!alreadyApproved) {
                  await github.rest.pulls.createReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    event: 'APPROVE',
                    body: 'All checks passed — auto-approved.'
                  });
                  core.notice(`PR #${prNumber} auto-approved`);
                } else {
                  core.notice(`PR #${prNumber} already has bot approval`);
                }
                return;
              }

              if (combined.state === 'failure') {
                core.setFailed(`Some checks failed for ${headSha.slice(0,8)} — not approving`);
                return;
              }

              await sleep(POLL_INTERVAL * 1000);
              waited += POLL_INTERVAL;
            }

            core.setFailed(`Timeout after ${MAX_WAIT_SECONDS}s waiting for checks on ${headSha.slice(0,8)}`);
