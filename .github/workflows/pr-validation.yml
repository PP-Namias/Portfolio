name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: portfolio-v1

      - name: Rebuild native modules
        run: npm rebuild
        working-directory: portfolio-v1

      - name: Lint Check
        run: npm run lint
        working-directory: portfolio-v1

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: portfolio-v1

      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || 'nl0qw78w' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN || '' }}
        run: npm run build
        working-directory: portfolio-v1
        # NOTE: Build requires Sanity env vars for ISR content fetching.
        # Secrets are read-only tokens (not deploy keys) and the build step
        # only executes trusted project code (npm run build), not lifecycle scripts.

      - name: Run Tests
        run: npm test
        working-directory: portfolio-v1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: portfolio-v1

      - name: Rebuild native modules
        run: npm rebuild
        working-directory: portfolio-v1

      - name: Security Audit
        run: npm audit --audit-level moderate || echo "Audit completed with warnings"
        working-directory: portfolio-v1

  comment:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [quality-check, security]
    if: always() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post PR Comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              qualityCheck: '${{ needs.quality-check.result }}',
              security: '${{ needs.security.result }}'
            };

            const label = (s) => s === 'success' ? 'Passed' : s === 'failure' ? 'Failed' : 'Skipped';

            const body = `## Pull Request Validation Results

            | Check | Status |
            |-------|--------|
            | Quality (Lint + Type + Build + Tests) | ${label(results.qualityCheck)} (${results.qualityCheck}) |
            | Security Audit | ${label(results.security)} (${results.security}) |

            **Overall**: ${results.qualityCheck === 'success' && results.security === 'success' ? 'Ready to merge' : 'Issues found — see details below'}

            ${results.qualityCheck !== 'success' ? '**Quality Check failed** — review the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for lint, type, build, or test errors.' : ''}
            ${results.security !== 'success' ? '**Security Scan failed** — review the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for dependency vulnerabilities.' : ''}

            ---
            *Auto-approval is handled by a separate workflow that polls ALL required checks.*`;

            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

              const botComment = comments.data.find(c =>
                c.user?.type === 'Bot' && c.body?.includes('Pull Request Validation Results')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: body
                });
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Skipping PR status comment: ${message}`);
            }
