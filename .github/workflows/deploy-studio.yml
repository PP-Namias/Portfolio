name: Deploy Sanity Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy-studio:
    name: Deploy Sanity Studio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild

      - name: Install studio dependencies (no lifecycle scripts)
        run: npm ci --prefix studio --ignore-scripts

      - name: Rebuild studio native modules
        run: npm rebuild --prefix studio

      - name: Deploy studio
        env:
          SANITY_STUDIO_DEPLOY_TOKEN: ${{ secrets.SANITY_STUDIO_DEPLOY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm --prefix studio run deploy
