name: osv-scanner

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: scan-npm-for-cves
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@fa4ff678dd5d0a4fa3d628e57af8162873e93cd6 # v2.0.3
    with:
      scan-args: --config=osv-scanner.toml -r ./
      results-file-name: osv.sarif
      upload-sarif: true
      fail-on-vuln: true
      export-results: false
