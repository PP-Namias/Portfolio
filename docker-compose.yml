name: namias-portfolio

services:
  portfolio-v1:
    build:
      context: ./portfolio-v1
      dockerfile: Dockerfile
      target: deps
    container_name: namias-v1-dev
    ports:
      - "3000:3000"
    volumes:
      - ./portfolio-v1:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
    command: npx next dev -p 3000
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - namias-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: deps
    container_name: namias-ai-dev
    ports:
      - "8787:8787"
    volumes:
      - ./ai-service:/app
      - /app/node_modules
      - ai-data:/app/.ai-service-data
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8787
    command: npm run dev
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - namias-net

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
      target: deps
    container_name: namias-studio-dev
    ports:
      - "3333:3333"
    volumes:
      - ./studio:/app
      - /app/node_modules
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - PORT=3333
    command: npm run dev
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - namias-net

volumes:
  ai-data:

networks:
  namias-net:
    driver: bridge
    name: namias-dev-net
