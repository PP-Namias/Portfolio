worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # ---- AI Service: /api/ai/* -> ai-service /api/* ----
    # Strips only the "/ai" segment so internal routes (/api/chat,
    # /api/threads, /api/health, /api/admin) resolve correctly.
    location /api/ai/ {
      proxy_pass http://ai-service:8787/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }

    # ---- Portfolio V1: everything else -> portfolio-v1:3000 ----
    # SSE streaming requires buffering off.
    location / {
      proxy_pass http://portfolio-v1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
      proxy_buffering off;
    }
  }
}
