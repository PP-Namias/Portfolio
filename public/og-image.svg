<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="50%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#2a1a35"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff63a5"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff63a5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff63a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="1050" cy="100" rx="300" ry="200" fill="url(#glowPink)"/>
  <ellipse cx="150" cy="530" rx="280" ry="200" fill="url(#glowCyan)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGradient)"/>

  <!-- Brand badge -->
  <g transform="translate(100, 80)">
    <rect width="60" height="60" rx="14" fill="#ff63a5"/>
    <text x="30" y="42" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">JN</text>
  </g>

  <!-- Tag line above the name -->
  <text x="180" y="120" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="500" fill="#06b6d4" letter-spacing="2">
    PORTFOLIO • 2026
  </text>

  <!-- Main name -->
  <text x="100" y="280" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Jhon Keneth
  </text>
  <text x="100" y="356" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">
    <tspan fill="#ff63a5">Ryan</tspan> Namias
  </text>

  <!-- Role / tagline -->
  <text x="100" y="410" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#a78bfa">
    Full Stack Engineer &amp; AI Automation Specialist
  </text>

  <!-- Divider -->
  <line x1="100" y1="440" x2="240" y2="440" stroke="#ff63a5" stroke-width="3"/>

  <!-- Tech stack tags -->
  <g transform="translate(100, 480)" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500">
    <g>
      <rect x="0" y="0" width="78" height="36" rx="18" fill="rgba(255,99,165,0.15)" stroke="#ff63a5" stroke-width="1"/>
      <text x="39" y="24" fill="#ff63a5" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="106" height="36" rx="18" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1"/>
      <text x="53" y="24" fill="#a78bfa" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="76" height="36" rx="18" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
      <text x="38" y="24" fill="#06b6d4" text-anchor="middle">Sanity</text>
    </g>
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
      <text x="60" y="24" fill="#22c55e" text-anchor="middle">Cloudflare</text>
    </g>
  </g>

  <!-- Bottom row: location + URL -->
  <g transform="translate(100, 560)">
    <circle cx="6" cy="6" r="5" fill="#22c55e"/>
    <circle cx="6" cy="6" r="9" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <text x="22" y="11" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#cbd5e1">Available for new work</text>
  </g>

  <text x="1100" y="571" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="600" fill="#06b6d4" text-anchor="end">namias.tech</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accentGradient)"/>
</svg>
