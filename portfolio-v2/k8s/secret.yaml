apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: namias
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  SANITY_API_READ_TOKEN: "REPLACE_WITH_BASE64_ENCODED_TOKEN"
  SANITY_API_WRITE_TOKEN: "REPLACE_WITH_BASE64_ENCODED_TOKEN"
  SANITY_REVALIDATE_SECRET: "REPLACE_WITH_RANDOM_SECRET"
  SANITY_DRAFT_SECRET: "REPLACE_WITH_RANDOM_SECRET"
  GITHUB_API_TOKEN: "REPLACE_WITH_GITHUB_TOKEN"
  OPENPANEL_PROJECT_ID: "REPLACE_WITH_PROJECT_ID"
  OPENPANEL_CLIENT_ID: "REPLACE_WITH_CLIENT_ID"
  OPENPANEL_CLIENT_SECRET: "REPLACE_WITH_CLIENT_SECRET"
---
# NOTE: For production, use one of these approaches instead of plain secrets:
#
# 1. Sealed Secrets (recommended for GitOps):
#    kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# 2. External Secrets Operator:
#    Store secrets in AWS SSM, GCP Secret Manager, or Azure Key Vault
#
# 3. SOPS with age:
#    sops --encrypt --in-place secret.yaml
#
# 4. Manual creation:
#    kubectl create secret generic portfolio-secrets \
#      --namespace=namias \
#      --from-literal=SANITY_API_READ_TOKEN=xxx \
#      --from-literal=SANITY_REVALIDATE_SECRET=yyy
