# Path routing:
#   /            -> portfolio-v1 (ClusterIP 3000)
#   /api/ai/*    -> ai-service (ClusterIP 8787, /ai segment stripped)
# Studio stays internal (ClusterIP 3333) - its SPA assets are root-absolute,
# so path-based exposure requires a studio vite base config first.
#
# The AI path uses a regex capture + rewrite-target so /api/ai/chat maps to
# the service's internal /api/chat route. This requires
# ImplementationSpecific pathType (documented deviation from Prefix).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: namias-portfolio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - namias.tech
      secretName: namias-tech-tls
  rules:
    - host: namias.tech
      http:
        paths:
          - path: /api/ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-service
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-v1
                port:
                  number: 3000
