apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-v1
  namespace: namias-portfolio
  labels:
    app: portfolio-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-v1
  template:
    metadata:
      labels:
        app: portfolio-v1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio-v1
          image: ghcr.io/pp-namias/portfolio-v1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-secrets
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: namias-portfolio
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: ghcr.io/pp-namias/ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-secrets
          env:
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: ai-data
              mountPath: /app/.ai-service-data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: ai-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
  namespace: namias-portfolio
  labels:
    app: studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio
  template:
    metadata:
      labels:
        app: studio
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: studio
          image: ghcr.io/pp-namias/studio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3333"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "0.5"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3333
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
