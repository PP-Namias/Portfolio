# Template only. Copy to secrets.yaml, fill base64 values, and apply.
# Never commit a populated secrets.yaml.
#
# Generate values:
#   echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: namias-portfolio
type: Opaque
stringData:
