apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: namias-portfolio
data:
  # ---- Non-secret shared config (mirrors .env.docker.example) ----
  NEXT_PUBLIC_SANITY_PROJECT_ID: "nl0qw78w"
  NEXT_PUBLIC_SANITY_DATASET: "production"
  NEXT_PUBLIC_SITE_URL: "https://namias.tech"
  SANITY_STUDIO_PROJECT_ID: "nl0qw78w"
  SANITY_STUDIO_DATASET: "production"

  # AI service
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "8787"
  AI_SERVICE_CORS_ORIGINS: "https://namias.tech"
  AI_SERVICE_TRUST_PROXY: "1"
  AI_LLM_MODEL: "gemini-2.5-flash"
  AI_LLM_FALLBACK_MODEL: "gemini-1.5-pro"
  AI_EMBEDDING_MODEL: "gemini-embedding-001"
  AI_EMBEDDING_DIMENSIONS: "768"
  AI_RAG_TOP_K: "6"
  AI_RAG_SIMILARITY_THRESHOLD: "0.6"
  AI_MAX_TOKENS: "1024"
  AI_TEMPERATURE: "0.3"

  # Analytics (optional)
  NEXT_PUBLIC_UMAMI_SCRIPT_URL: "https://cloud.umami.is/script.js"
  NEXT_PUBLIC_UMAMI_HOST_URL: "https://api-gateway.umami.dev"
